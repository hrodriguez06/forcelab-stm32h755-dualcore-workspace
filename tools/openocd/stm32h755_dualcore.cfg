# ---------------------------------------------------------------------------
# OpenOCD target configuration - NUCLEO-H755ZI-Q (STM32H755ZI, dual-core)
#
# ST ships interface/ and target/ scripts with STM32CubeIDE but no board file
# for this Nucleo, so this is it. tools/flash.py passes the ST script directory
# with -s, which is what makes the `find` calls below resolve.
#
# Why stlink-dap and not stlink: target/stm32h7x.cfg refuses DUAL_CORE on an
# HLA transport ("hla does not support multicore debugging") and shuts down.
# dapdirect_swd exposes the raw DAP, which is what reaching CPU2 requires.
# ST-LINK/V2 firmware older than V2J24 cannot do this; the on-board ST-LINK/V3
# of the Nucleo-H755ZI-Q can.
#
# DUAL_BANK=1 gives two 1 MB flash banks: bank 1 at 0x08000000 (CPU1) and
# bank 2 at 0x08100000 (CPU2), matching the linker scripts.
# ---------------------------------------------------------------------------

source [find interface/stlink-dap.cfg]

transport select dapdirect_swd

set CHIPNAME   stm32h755
set BOARDNAME  NUCLEO-H755ZI-Q
set DUAL_BANK  1

# Dual-core is the default, but it is a *declaration that CPU2 is reachable*,
# and that is only true once CPU2 has an image and BCM4 is enabled. Until then
# every reset fails with
#
#   Error: [stm32h755.cm4] Debug AP not available, reset NOT asserted!
#
# because the reset path still goes through CPU2's access port. Deferring the
# examination does not help - reset participation is separate from examination.
#
# So the value is overridable, and tools/flash.py passes 0 whenever it is not
# programming a CPU2 image:
#
#   openocd -c "set DUAL_CORE 0" -f tools/openocd/stm32h755_dualcore.cfg ...
#
# Both flash banks stay reachable either way: they hang off the CPU1 target.
if { ![info exists DUAL_CORE] } {
    set DUAL_CORE 1
}

# AP_NUM has no default and target/stm32h7x.cfg reads it unconditionally on a
# non-HLA transport, so leaving it out aborts with "can't read AP_NUM".
# It doubles as a core filter: 0 debugs CPU1 only, 3 debugs CPU2 only, and any
# other value leaves both enabled. 2 is also what puts the APB-AP - the debug
# and trace bus - on access port 2, where the H7 actually has it.
set AP_NUM 2

# The script's own way of asserting NRST during the attach. Needed for the same
# reason the CubeProgrammer commands in this project use mode=UR: a firmware
# that has already reconfigured the clock tree or entered a low-power mode can
# otherwise refuse the connection.
set CONNECT_UNDER_RESET 1

# CORE_RESET=0 selects SYSRESETREQ; the script's default of 1 selects VECTRESET.
# VECTRESET is deprecated on ARMv7-M and unreliable on the Cortex-M7: combined
# with CONNECT_UNDER_RESET above it hangs, and every reset ends in
#
#   Error: timed out while waiting for target halted
#
# which looks like a dead board rather than a reset-method problem. Measured on
# this Nucleo: VECTRESET + connect-under-reset times out, SYSRESETREQ halts
# cleanly. Do not raise this to 1 without retesting `reset halt`.
set CORE_RESET 0

source [find target/stm32h7x.cfg]

# In dual-core mode, do not examine CPU2 at startup. A core that is held in
# reset answers with garbage instead of the Cortex-M4 CPUID 0x410FC241:
#
#   Error: [stm32h755.cm4] Cortex-M CPUID: 0x24770011 is unrecognized
#
# The target still exists and still gets a GDB port (3334); it is just skipped
# until something asks for it, with `arp_examine` on the stm32h755.cm4 target.
if { $DUAL_CORE } {
    stm32h755.cm4 configure -defer-examine
}
